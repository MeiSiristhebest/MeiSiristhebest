name: Generate Profile Assets

on:
  schedule:
    - cron: "0 2,14 * * *"   # 北京时间 10:00 和 22:00
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Step 1: 贪吃蛇（Catppuccin Latte / 柔和薰衣草柔光配色）
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          outputs: |
            github-contribution-grid-snake.svg?color_snake=#8839ef&color_dots=#eff1f5,#ccd0da,#8c8fa1,#7287fd,#8839ef
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: 吃豆人（生成到 dist/ → 推到 output 独立分支）
      - name: Generate Pacman SVG
        uses: abozanona/pacman-contribution-graph@main
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          player_style: aggressive

      - name: Push Pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: 奖杯墙（Flat 柔和主题）
      - name: Create trophy output directory
        run: mkdir -p trophy_out

      - name: Generate Trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: MeiSiristhebest
          output_path: trophy_out/github-profile-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat

      - name: Copy Trophy SVG to repo root
        run: |
          if [ -f trophy_out/github-profile-trophy.svg ]; then
            cp trophy_out/github-profile-trophy.svg github-profile-trophy.svg
            echo "Trophy SVG copied successfully"
          else
            echo "Warning: trophy SVG not generated"
          fi

      # Step 4: 3D 贡献城堡（生成到 profile-3d-contrib/）
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: MeiSiristhebest

      # Step 5: 静态资源抓取 + Catppuccin Latte 顶级柔美调色盘一言金句卡片
      - name: Fetch SVG Assets and Generate Quote Card
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, html

          # 采用专业设计的主题：Catppuccin Latte / Soft Pastel 薰衣草-马卡龙柔光调色盘
          targets = [
              ('header-wave.svg',
               'https://capsule-render.vercel.app/api?type=waving&color=0:8839ef,50:7287fd,100:ea76cb&height=220&section=header&text=Nefelibata&fontSize=42&fontColor=ffffff&fontAlignY=38&desc=A%20cloud%20walker%20translating%20daydreams%20into%20code.&descSize=15&descAlignY=58',
               '<svg'),
              ('streak-stats.svg',
               'https://streak-stats.demolab.com/?user=MeiSiristhebest&theme=catppuccin_latte&hide_border=true',
               '<svg'),
              ('github-activity-graph.svg',
               'https://github-readme-activity-graph.vercel.app/graph?username=MeiSiristhebest&bg_color=eff1f5&color=8839ef&line=7287fd&point=ea76cb&area=true&hide_border=true',
               'svg'),
          ]
          for fname, url, check in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read().decode('utf-8')
                  if check in data:
                      with open(fname, 'w', encoding='utf-8') as f:
                          f.write(data)
                      print(f'Fetched {fname}')
              except Exception as e:
                  print(f'Warning: {fname}: {e}')

          # 生成设计感极强的 Catppuccin Latte 浅系柔色一言卡片
          qt = 'Simplicity is precondition for reliability.'
          au = 'Edsger W. Dijkstra'
          try:
              req = urllib.request.Request('https://dummyjson.com/quotes/random', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=8) as r:
                  d = json.loads(r.read().decode('utf-8'))
                  qt, au = d.get('quote', qt), d.get('author', au)
          except Exception:
              pass

          qt_esc = html.escape(qt)
          au_esc = html.escape(au)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="750" height="115" viewBox="0 0 750 115" fill="none">
            <defs>
              <linearGradient id="bgGrad" x1="0" y1="0" x2="750" y2="115" gradientUnits="userSpaceOnUse">
                <stop stop-color="#eff1f5"/>
                <stop offset="1" stop-color="#e6e9ef"/>
              </linearGradient>
              <linearGradient id="borderGrad" x1="0" y1="0" x2="750" y2="115" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7287fd" stop-opacity="0.6"/>
                <stop offset="1" stop-color="#ea76cb" stop-opacity="0.6"/>
              </linearGradient>
              <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="115" gradientUnits="userSpaceOnUse">
                <stop stop-color="#8839ef"/>
                <stop offset="1" stop-color="#ea76cb"/>
              </linearGradient>
              <linearGradient id="quoteMarkGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7287fd"/>
                <stop offset="1" stop-color="#8839ef"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="746" height="111" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
            <rect x="2" y="18" width="6" height="79" rx="3" fill="url(#accentGrad)"/>
            <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="url(#quoteMarkGrad)" opacity="0.18">“</text>
            <text x="56" y="52" fill="#4c4f69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" font-style="italic">&quot;{qt_esc}&quot;</text>
            <text x="716" y="90" fill="#8839ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">— {au_esc}</text>
          </svg>'''
          with open('geek-quote.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          print('Generated Catppuccin Latte geek-quote.svg')
          PYEOF

      # Step 6: GitHub Metrics 看板生成
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MeiSiristhebest
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          repositories_forks: yes
          commits_authoring: MeiSiristhebest, Mei, MTx1534572236@outlook.com
          config_animations: no
          config_padding: 0, 20%
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_lines: no
          plugin_activity: no
          plugin_achievements: no
          plugin_habits: no
          plugin_isocalendar: no

      # Step 7: 统一提交并推送所有生成的 SVG 资源
      - name: Commit and Push All Generated Assets
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg profile-3d-contrib/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update generated SVG assets with Catppuccin Latte theme [skip ci]"
            git fetch origin main
            git rebase origin/main || git rebase --skip
            git push origin main
          fi
