name: Generate Profile Assets

on:
  schedule:
    - cron: "0 2,14 * * *"   # 北京时间 10:00 和 22:00
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Step 1: 贪吃蛇（GitHub Light / 白底适配）
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          outputs: |
            github-contribution-grid-snake.svg?palette=github-light
            github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: 吃豆人（生成到 dist/ → 推到 output 独立分支，Light/Dark 双版本）
      - name: Generate Pacman SVG
        uses: abozanona/pacman-contribution-graph@main
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          player_style: aggressive

      - name: Push Pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: 奖杯墙（Flat 浅色主题，清爽白底适配）
      - name: Create trophy output directory
        run: mkdir -p trophy_out

      - name: Generate Trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: MeiSiristhebest
          output_path: trophy_out/github-profile-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: flat

      - name: Copy Trophy SVG to repo root
        run: |
          if [ -f trophy_out/github-profile-trophy.svg ]; then
            cp trophy_out/github-profile-trophy.svg github-profile-trophy.svg
            echo "Trophy SVG copied successfully"
          else
            echo "Warning: trophy SVG not generated"
          fi

      # Step 4: 3D 贡献城堡（生成到 profile-3d-contrib/）
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: MeiSiristhebest

      # Step 5: 静态资源抓取（全面切换为 GitHub Light 浅色透明原生风格）
      - name: Fetch SVG Assets
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import urllib.request

          targets = [
              ('header-wave.svg',
               'https://capsule-render.vercel.app/api?type=waving&color=0:3b82f6,100:8b5cf6&height=220&section=header&text=Nefelibata&fontSize=42&fontColor=ffffff&fontAlignY=38&desc=A%20cloud%20walker%20translating%20daydreams%20into%20code.&descSize=15&descAlignY=58',
               '<svg'),
              ('streak-stats.svg',
               'https://streak-stats.demolab.com/?user=MeiSiristhebest&theme=default&hide_border=true',
               '<svg'),
              ('github-activity-graph.svg',
               'https://github-readme-activity-graph.vercel.app/graph?username=MeiSiristhebest&theme=github-light&hide_border=true',
               'svg'),
          ]
          for fname, url, check in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read().decode('utf-8')
                  if check in data:
                      with open(fname, 'w', encoding='utf-8') as f:
                          f.write(data)
                      print(f'Fetched {fname}')
              except Exception as e:
                  print(f'Warning: {fname}: {e}')
          PYEOF

      # Step 6: GitHub Metrics 看板生成（Light 主题 + 开启 indepth 修复 Most used languages 空白 bug）
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MeiSiristhebest
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          repositories_forks: yes
          commits_authoring: MeiSiristhebest, Mei, MTx1534572236@outlook.com
          config_animations: no
          config_padding: 0, 20%
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_indepth: yes
          plugin_lines: no
          plugin_activity: no
          plugin_achievements: no
          plugin_habits: no
          plugin_isocalendar: no

      # Step 7: 统一提交并推送所有生成的 SVG 资源
      - name: Commit and Push All Generated Assets
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg profile-3d-contrib/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update generated SVG assets (light mode) [skip ci]"
            git fetch origin main
            git rebase origin/main || git rebase --skip
            git push origin main
          fi
