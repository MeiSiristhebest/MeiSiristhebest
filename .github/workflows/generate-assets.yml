name: Generate Profile Assets

on:
  schedule:
    - cron: "0 2,14 * * *"  # 💡 每天北京时间 10:00 和 22:00 定时自动运行
  push:
    branches:
      - main
    paths-ignore:
      - "github-contribution-grid-snake*"
      - "profile-3d-contrib/**"
      - "github-metrics.svg"
      - "github-activity-graph.svg"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 生成贪吃蛇 SVG
      - name: Generate Snake Game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: MeiSiristhebest
          outputs: |
            github-contribution-grid-snake-dark.svg?palette=github-dark
            github-contribution-grid-snake.svg

      # 2. 生成 3D 贡献城堡
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: MeiSiristhebest

      # 3. 抓取并保存极客活跃度曲线图静态 SVG (带容错防崩溃校验)
      - name: Fetch and Save Activity Graph SVG
        run: |
          python3 -c "
          import urllib.request
          url = 'https://github-readme-activity-graph.vercel.app/graph?username=MeiSiristhebest&theme=react-dark&bg_color=1a1b26&color=70a5fd&line=70a5fd&point=ffffff&hide_border=true'
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = resp.read().decode('utf-8')
                  if 'Can\'t fetch' not in data and 'Contribution Graph' in data:
                      with open('github-activity-graph.svg', 'w', encoding='utf-8') as f:
                          f.write(data)
                      print('Successfully updated github-activity-graph.svg')
                  else:
                      print('Warning: API returned error message, preserving existing SVG')
          except Exception as e:
              print(f'Warning: Fetch failed ({e}), preserving existing SVG')
          "

      # 4. 调用 lowlighter/metrics 生成全景看板（放大 padding 至 20%，彻底根除 Most used languages 底部文字裁切截断 Bug）
      - name: Generate GitHub Metrics Infographics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MeiSiristhebest
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          committer_token: ${{ secrets.METRICS_TOKEN }}  # 全量打包工作区资产自动 push
          repositories_forks: yes
          commits_authoring: MeiSiristhebest, Mei, MTx1534572236@outlook.com

          # 💡 [关键修复] 20% 底部 padding，确保 Most used languages 底部文字 100% 舒展不截断
          config_metadata: no
          config_animations: no
          config_padding: 0, 20%

          # 💡 [超稳核心 1] 编程语言分析
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 0

          # 💡 关闭会报 Unexpected error 的代码行数统计插件
          plugin_lines: no

          # 💡 彻底关闭会报Unexpected error的子插件
          plugin_activity: no
          plugin_achievements: no
          plugin_habits: no
          plugin_isocalendar: no
