name: Generate Profile Assets

on:
  schedule:
    - cron: "0 2,14 * * *"   # 北京时间 10:00 和 22:00
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Step 1: 霓虹冰蓝贪吃蛇（svg-only 更快）
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          outputs: |
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#70a5fd&color_dots=#1a1b26,#1f2335,#292e42,#70a5fd,#bb9af7
            github-contribution-grid-snake.svg

      # Step 2: 吃豆人（官方方式：生成到 dist/ → 推到 output 分支）
      - name: Generate Pacman SVG
        uses: abozanona/pacman-contribution-graph@main
        continue-on-error: true
        with:
          github_user_name: MeiSiristhebest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          player_style: aggressive

      - name: Push Pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        continue-on-error: true
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: 奖杯墙（纯文件名，不带 ./ — 修复 Deno mkdir 权限 bug）
      - name: Generate Trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: MeiSiristhebest
          output_path: github-profile-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight

      # Step 4: 3D 贡献城堡（官方 latest + 自带 git push）
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: MeiSiristhebest

      - name: Commit and Push 3D Calendar
        continue-on-error: true
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib/
          if git commit -m "chore: update 3D contribution calendar [skip ci]"; then
            git push
          fi

      # Step 5: 静态资源抓取 + 每日金句生成
      - name: Fetch SVG Assets and Generate Quote
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import urllib.request, json, html

          targets = [
              ('header-wave.svg',
               'https://capsule-render.vercel.app/api?type=waving&color=0:1a1b26,100:70a5fd&height=260&section=header&text=Nefelibata&fontSize=48&fontColor=ffffff&fontAlignY=38&desc=A%20cloud%20walker%20translating%20daydreams%20into%20code.&descSize=15&descAlignY=58',
               '<svg'),
              ('streak-stats.svg',
               'https://streak-stats.demolab.com/?user=MeiSiristhebest&theme=tokyonight&hide_border=true',
               '<svg'),
              ('github-activity-graph.svg',
               'https://github-readme-activity-graph.vercel.app/graph?username=MeiSiristhebest&theme=react-dark&bg_color=1a1b26&color=70a5fd&line=70a5fd&point=ffffff&hide_border=true',
               'svg'),
          ]
          for fname, url, check in targets:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read().decode('utf-8')
                  if check in data:
                      with open(fname, 'w', encoding='utf-8') as f:
                          f.write(data)
                      print(f'Fetched {fname}')
              except Exception as e:
                  print(f'Warning: {fname}: {e}')

          qt = 'Simplicity is precondition for reliability.'
          au = 'Edsger W. Dijkstra'
          try:
              req = urllib.request.Request('https://dummyjson.com/quotes/random', headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=8) as r:
                  d = json.loads(r.read().decode('utf-8'))
                  qt, au = d.get('quote', qt), d.get('author', au)
          except Exception:
              pass
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="700" height="100" viewBox="0 0 700 100">
            <rect width="700" height="100" rx="10" fill="#1a1b26" stroke="#30363d" stroke-width="1"/>
            <text x="25" y="42" fill="#70a5fd" font-family="'Fira Code',monospace" font-size="14" font-weight="bold">&#x1F4AC; &quot;{html.escape(qt)}&quot;</text>
            <text x="675" y="75" fill="#bb9af7" font-family="'Fira Code',monospace" font-size="12" text-anchor="end">&#x2014; {html.escape(au)}</text>
          </svg>'''
          with open('geek-quote.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          print('Generated geek-quote.svg')
          PYEOF

      # Step 6: Metrics（用 METRICS_TOKEN，内部自带 commit+push）
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@master
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MeiSiristhebest
          template: classic
          base: header, activity, community, repositories
          filename: github-metrics.svg
          committer_token: ${{ secrets.METRICS_TOKEN }}
          repositories_forks: yes
          commits_authoring: MeiSiristhebest, Mei, MTx1534572236@outlook.com
          config_metadata: no
          config_animations: no
          config_padding: 0, 20%
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_lines: no
          plugin_activity: no
          plugin_achievements: no
          plugin_habits: no
          plugin_isocalendar: no

      # Step 7: 统一 Push snake、trophy、静态卡片、金句
      - name: Commit and Push All Other Generated Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update generated SVG assets [skip ci]"
          file_pattern: "*.svg"
