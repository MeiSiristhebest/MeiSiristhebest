<svg xmlns="http://www.w3.org/2000/svg" width="750" height="115" viewBox="0 0 750 115" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="750" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff1f5"/>
      <stop offset="1" stop-color="#e6e9ef"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="750" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7287fd" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ea76cb" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="0" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8839ef"/>
      <stop offset="1" stop-color="#ea76cb"/>
    </linearGradient>
    <linearGradient id="quoteMarkGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7287fd"/>
      <stop offset="1" stop-color="#8839ef"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="746" height="111" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="18" width="6" height="79" rx="3" fill="url(#accentGrad)"/>
  <text x="22" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#quoteMarkGrad)" opacity="0.15">“</text>
  <text x="48" y="54" fill="#4c4f69" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.0" font-weight="500" font-style="italic">“To improve is to change; to be perfect is to change often.”</text>
  <text x="716" y="90" fill="#8839ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="end">— Winston Churchill</text>
</svg>